<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | FoodHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange: #ff6b00;
            --orange-dark: #e85d04;
            --cream: #fffaf5;
            --dark: #252525;
            --gray: #777777;
            --border: #eadfd4;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 10% 15%, #ffe6d2 0, transparent 30%),
                radial-gradient(circle at 90% 85%, #ffeadb 0, transparent 30%),
                var(--cream);
            display: flex;
            flex-direction: column;
            color: var(--dark);
        }

        /* Navbar */
        .navbar {
            width: 100%;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--dark);
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo-icon {
            width: 43px;
            height: 43px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--orange);
            color: white;
            border-radius: 14px;
            box-shadow: 0 6px 15px #ff6b0033;
        }

        .logo span {
            color: var(--orange);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--dark);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--orange);
        }

        /* Main content */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px 60px;
        }

        .forgot-card {
            width: 100%;
            max-width: 460px;
            padding: 42px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #f1e5da;
            border-radius: 24px;
            box-shadow: 0 18px 55px rgba(65, 42, 22, 0.09);
            animation: slideUp 0.65s ease both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            width: 76px;
            height: 76px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: linear-gradient(135deg, #fff0e4, #ffe0c8);
            color: var(--orange);
            font-size: 30px;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 12px;
        }

        .heading h1 span {
            color: var(--orange);
        }

        .heading p {
            color: var(--gray);
            font-size: 14px;
            line-height: 1.8;
        }

        /* Controller message */
        .message {
            padding: 13px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .success-message {
            color: #17643b;
            background: #eaf8ef;
            border: 1px solid #c9ead5;
        }

        .error-message {
            color: #a32d22;
            background: #fff0ee;
            border: 1px solid #f4d0cb;
        }

        /* Form */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: 700;
            color: #333333;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper > i {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            color: #a5a5a5;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            height: 53px;
            padding: 0 15px 0 46px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: #fffdfa;
            font-family: inherit;
            font-size: 14px;
            color: var(--dark);
            transition: border-color 0.3s ease,
                        box-shadow 0.3s ease,
                        background 0.3s ease;
        }

        .input-wrapper input::placeholder {
            color: #aaaaaa;
        }

        .input-wrapper input:focus {
            background: #ffffff;
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.10);
        }

        .input-wrapper:focus-within > i {
            color: var(--orange);
        }

        /* Submit button */
        .submit-button {
            width: 100%;
            min-height: 53px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--orange), #ff8a32);
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 18px rgba(255, 107, 0, 0.20);
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease,
                        background 0.3s ease;
        }

        .submit-button:hover {
            background: linear-gradient(135deg, #ed6000, #ff7b1c);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 107, 0, 0.27);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .submit-button:focus-visible,
        .back-link:focus-visible,
        .bottom-link:focus-visible {
            outline: 3px solid #ffb37e;
            outline-offset: 4px;
        }

        .bottom-link {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: var(--gray);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .bottom-link strong {
            color: var(--orange);
            font-weight: 700;
        }

        .bottom-link:hover {
            color: var(--orange-dark);
        }

        .security-note {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f0e8e0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 9px;
            color: #858585;
            font-size: 11px;
            line-height: 1.7;
            text-align: center;
        }

        .security-note i {
            color: #43a66c;
            margin-top: 2px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 18px 15px 25px;
            color: #929292;
            font-size: 12px;
        }

        .footer span {
            color: var(--orange);
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 520px) {
            .navbar {
                padding: 18px 5%;
            }

            .logo {
                font-size: 21px;
            }

            .logo-icon {
                width: 38px;
                height: 38px;
                border-radius: 12px;
            }

            .back-link {
                font-size: 12px;
            }

            .main-container {
                padding: 25px 16px 40px;
                align-items: flex-start;
            }

            .forgot-card {
                padding: 30px 23px;
                border-radius: 20px;
            }

            .heading h1 {
                font-size: 25px;
            }

            .icon-wrapper {
                width: 68px;
                height: 68px;
                font-size: 26px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <a th:href="@{/}" href="/" class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-utensils"></i>
            </div>
            Food<span>Hub</span>
        </a>

        <a th:href="@{/login}" href="/login" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Login
        </a>
    </header>

    <!-- Main content -->
    <main class="main-container">
        <section class="forgot-card">

            <div class="icon-wrapper">
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="heading">
                <h1>Forgot <span>Password?</span></h1>
                <p>
                    Enter your registered email address below.
                    We'll help you with the next steps to recover your account.
                </p>
            </div>

            <!-- Success message from Spring Boot -->
            <div th:if="${message}"
                 th:text="${message}"
                 class="message success-message"
                 role="status"
                 aria-live="polite">
            </div>

            <!-- Error message from Spring Boot -->
            <div th:if="${error}"
                 th:text="${error}"
                 class="message error-message"
                 role="alert">
            </div>

            <!-- Forgot password form -->
            <form th:action="@{/forgot-password}"
                  action="/forgot-password"
                  method="post"
                  id="forgotPasswordForm">

                <div class="form-group">
                    <label for="email">Registered Email Address</label>

                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your registered email"
                            th:value="${email}"
                            autocomplete="email"
                            maxlength="254"
                            required>
                    </div>
                </div>

                <button type="submit" class="submit-button">
                    <span>Continue</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <a th:href="@{/login}" href="/login" class="bottom-link">
                <i class="fa-solid fa-arrow-left"></i>
                Return to <strong>Login</strong>
            </a>

            <div class="security-note">
                <i class="fa-solid fa-shield-halved"></i>
                <span>
                    Your account security matters to us.
                    Never share your password with anyone.
                </span>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        © 2026 <span>FoodHub</span>. All rights reserved.
    </footer>

</body>
</html>

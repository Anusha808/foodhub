<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | FoodHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', sans-serif;
            background: #fffaf5;
            color: #252525;
        }

        header {
            padding: 22px 7%;
        }

        .logo {
            color: #252525;
            font-size: 25px;
            font-weight: 800;
            text-decoration: none;
        }

        .logo span {
            color: #ff6b00;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 18px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            background: white;
            border: 1px solid #f0e2d6;
            border-radius: 22px;
            box-shadow: 0 15px 45px #40200d12;
            animation: appear 0.5s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            width: 68px;
            height: 68px;
            display: grid;
            place-items: center;
            margin: 0 auto 20px;
            background: #fff0e4;
            color: #ff6b00;
            border-radius: 20px;
            font-size: 27px;
        }

        h1 {
            margin-bottom: 12px;
            text-align: center;
            font-size: 27px;
        }

        h1 span {
            color: #ff6b00;
        }

        .description {
            margin-bottom: 25px;
            text-align: center;
            color: #777;
            font-size: 13px;
            line-height: 1.7;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .error {
            color: #a32d22;
            background: #fff0ee;
        }

        .success {
            color: #17643b;
            background: #eaf8ef;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 13px;
            font-weight: 700;
        }

        .input-box {
            position: relative;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 44px 0 14px;
            border: 1px solid #eadfd4;
            border-radius: 10px;
            outline: none;
            font: inherit;
            font-size: 14px;
        }

        input:focus {
            border-color: #ff6b00;
            box-shadow: 0 0 0 3px #ff6b0018;
        }

        .toggle {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
        }

        button[type="submit"] {
            width: 100%;
            min-height: 51px;
            margin-top: 25px;
            border: 0;
            border-radius: 10px;
            background: #ff6b00;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button[type="submit"]:hover {
            background: #e85d04;
            transform: translateY(-1px);
        }

        .login-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #ff6b00;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        footer {
            padding: 20px;
            text-align: center;
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<header>
    <a th:href="@{/}" href="/" class="logo">
        <i class="fa-solid fa-utensils" style="color:#ff6b00;"></i>
        Food<span>Hub</span>
    </a>
</header>

<main>
    <section class="card">

        <div class="icon">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h1>Reset <span>Password</span></h1>

        <p class="description">
            Create a new password for your FoodHub account.
            Choose a password with at least 8 characters.
        </p>

        <div th:if="${error}"
             th:text="${error}"
             class="message error"
             role="alert"></div>

        <div th:if="${message}"
             class="message success"
             role="status">
            <span th:text="${message}"></span>
            <a th:if="${message.contains('successfully')}"
               th:href="@{/login}"
               style="color:#17643b;font-weight:700;">
                Go to Login
            </a>
        </div>

        <form th:if="${token != null}"
              th:action="@{/reset-password}"
              method="post"
              id="resetForm">

            <input type="hidden" name="token" th:value="${token}">

            <label for="password">New Password</label>
            <div class="input-box">
                <input type="password"
                       id="password"
                       name="password"
                       minlength="8"
                       autocomplete="new-password"
                       placeholder="Enter new password"
                       required>
                <i class="fa-regular fa-eye toggle"
                   data-target="password"
                   role="button"
                   tabindex="0"
                   aria-label="Show or hide password"></i>
            </div>

            <label for="confirmPassword">Confirm New Password</label>
            <div class="input-box">
                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       minlength="8"
                       autocomplete="new-password"
                       placeholder="Re-enter new password"
                       required>
                <i class="fa-regular fa-eye toggle"
                   data-target="confirmPassword"
                   role="button"
                   tabindex="0"
                   aria-label="Show or hide confirmation password"></i>
            </div>

            <button type="submit">
                <i class="fa-solid fa-check"></i>
                Update Password
            </button>
        </form>

        <a th:href="@{/login}" href="/login" class="login-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Login
        </a>

    </section>
</main>

<footer>© 2026 FoodHub. All rights reserved.</footer>

<script>
    document.querySelectorAll('.toggle').forEach(function (icon) {
        function togglePassword() {
            const input = document.getElementById(icon.dataset.target);

            if (!input) return;

            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';

            icon.classList.toggle('fa-eye', !show);
            icon.classList.toggle('fa-eye-slash', show);
        }

        icon.addEventListener('click', togglePassword);

        icon.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                togglePassword();
            }
        });
    });

    const resetForm = document.getElementById('resetForm');

    if (resetForm) {
        resetForm.addEventListener('submit', function (event) {
            const password = document.getElementById('password').value;
            const confirmPassword =
                document.getElementById('confirmPassword').value;

            if (password.length < 8) {
                event.preventDefault();
                alert('Password must contain at least 8 characters.');
            } else if (password !== confirmPassword) {
                event.preventDefault();
                alert('Passwords do not match.');
            }
        });
    }
</script>

</body>
</html>
